{% extends 'base.html' %}

{% block title %}VM 管理 - Azure Manager{% endblock %}

{% block content %}
<div class="app-page-header mb-4">
    <div>
        <h1 class="app-page-title">VM 管理</h1>
        <p class="app-page-subtitle">{{ credential.account }} · <span id="vm-count">加载中</span></p>
    </div>
    <div class="app-actions">
        <a class="btn btn-sm btn-light border" href="{{ url_for('index') }}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            返回
        </a>
        <button class="btn btn-sm btn-light border" type="button" id="vm-refresh">
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            刷新
        </button>
        <a class="btn btn-sm btn-primary" href="{{ url_for('create_vm', credential_id=credential.id) }}">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
            创建 VM
        </a>
    </div>
</div>

<div class="table-panel vm-table-scroll">
    <table class="table table-hover align-middle mb-0 vm-table">
        <colgroup>
            <col class="vm-name-col">
            <col class="vm-ip-col">
            <col class="vm-location-col">
            <col class="vm-size-col">
            <col class="vm-status-col">
            <col class="vm-actions-col">
        </colgroup>
        <thead>
            <tr>
                <th class="vm-name-column">名称</th>
                <th class="vm-ip-column">IP 地址</th>
                <th class="vm-location-column">位置</th>
                <th class="vm-size-column">规格</th>
                <th class="vm-status-column">状态</th>
                <th class="vm-actions-column">操作</th>
            </tr>
        </thead>
        <tbody id="vm-table-body"
               data-vm-list-url="{{ url_for('vm_list_data', credential_id=credential.id) }}"
               data-vm-operation-url="{{ operation_status_url or '' }}"
               aria-busy="true">
            <tr>
                <td colspan="6" class="empty-state">
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                    正在加载 VM...
                </td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}
